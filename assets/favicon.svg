<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ghazipur — a lotus with a lamp flame">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12211f"/>
      <stop offset=".55" stop-color="#1d3a38"/>
      <stop offset="1" stop-color="#2b5148"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".46" r=".5">
      <stop offset="0" stop-color="#ffd88a" stop-opacity=".85"/>
      <stop offset=".55" stop-color="#f0a34a" stop-opacity=".22"/>
      <stop offset="1" stop-color="#f0a34a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1c4"/>
      <stop offset=".45" stop-color="#ffc45e"/>
      <stop offset="1" stop-color="#e8762f"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe8d2"/>
      <stop offset="1" stop-color="#e9b98f"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#sky)"/>
  <circle cx="32" cy="30" r="26" fill="url(#glow)"/>

  <!-- still water -->
  <path d="M6 48.5c5-1.6 9-1.6 14 0s9 1.6 14 0 9-1.6 14 0 9 1.6 10 0" fill="none" stroke="#8fc9bd" stroke-opacity=".35" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M9 53.5c4.5-1.4 8-1.4 12.5 0s8 1.4 12.5 0 8-1.4 12.5 0 5.5 1.2 7 .6" fill="none" stroke="#8fc9bd" stroke-opacity=".2" stroke-width="1.2" stroke-linecap="round"/>

  <!-- lotus -->
  <g stroke="#0e1c1a" stroke-opacity=".18" stroke-width=".7" stroke-linejoin="round">
    <path d="M32 47.5c-7.6 0-13.4-3.4-15.6-8.2 3.6-1.2 7.6-.6 10.6 1.4 1.6-1.6 3.3-2.8 5-3.8 1.7 1 3.4 2.2 5 3.8 3-2 7-2.6 10.6-1.4-2.2 4.8-8 8.2-15.6 8.2z" fill="url(#petal)"/>
    <path d="M32 44.5c-4.2 0-7.6-3.3-7.6-7.4 0-5 4.6-7.8 7.6-13 3 5.2 7.6 8 7.6 13 0 4.1-3.4 7.4-7.6 7.4z" fill="url(#petal)"/>
    <path d="M20.6 37.2c-2.4-1.4-4-3.6-4.4-6.2 2.8-.4 5.2.6 6.8 2.4M43.4 37.2c2.4-1.4 4-3.6 4.4-6.2-2.8-.4-5.2.6-6.8 2.4" fill="#f7ddc6"/>
  </g>

  <!-- flame of the diya -->
  <path d="M32 9.5c3.4 3.6 5.4 6.6 5.4 9.6 0 3.3-2.4 5.7-5.4 5.7s-5.4-2.4-5.4-5.7c0-3 2-6 5.4-9.6z" fill="url(#flame)"/>
  <path d="M32 14.2c1.5 2 2.2 3.6 2.2 5 0 1.6-1 2.7-2.2 2.7s-2.2-1.1-2.2-2.7c0-1.4.7-3 2.2-5z" fill="#fffaf0" fill-opacity=".85"/>

  <!-- diya base -->
  <path d="M22.5 25.8h19c-.9 2.4-2.6 4-5.2 4.9-2.6.9-6 .9-8.6 0-2.6-.9-4.3-2.5-5.2-4.9z" fill="#c9762f"/>
  <path d="M22.5 25.8h19" stroke="#ffd7a3" stroke-width=".9" stroke-linecap="round" fill="none"/>
</svg>
